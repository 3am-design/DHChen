<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Preview only (remove at launch): every page sends visitors here
       until the preview password has been entered (see gate.js). -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Website preview — The D. H. Chen Foundation</title>
  <link rel="preload" href="assets/fonts/baskervville-regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <style>
    @font-face {
      font-family: Baskervville;
      src: url('assets/fonts/baskervville-regular.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100svh; padding: 20px;
      background: #fff2e9; color: #000;
      font: 400 17px/1.5 'Fira Sans', Arial, sans-serif;
    }
    /* no card: the logo, field and button sit on the page itself, centred,
       with plenty of air around them */
    main { display: flex; justify-content: center; width: 100%; }
    .gate { width: 100%; max-width: 360px; text-align: center; }
    .gate__logo { display: block; width: 184px; max-width: 70%; height: auto; margin: 0 auto 32px; }
    .gate__label {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    .gate__input {
      display: block; width: 100%; padding: 12px 20px;
      border: 1px solid #e3ba9c; border-radius: 100px;
      background: #fff; color: #000; font: inherit;
    }
    .gate__input:focus { outline: 2px solid #b84d00; outline-offset: 2px; }
    .gate__btn {
      margin-top: 20px; padding: 11px 32px; border: 0; border-radius: 100px;
      background: #ff6900; color: #fff; font: inherit; cursor: pointer;
      transition: background-color .25s ease;
    }
    .gate__btn:hover { background: #e85f00; }
    .gate__btn:focus-visible { outline: 2px solid #ff6900; outline-offset: 3px; }
    .gate__error { min-height: 1.5em; margin: 14px 0 0; font-size: 15px; color: #b84d00; }
  </style>
</head>
<body>
  <main>
    <form class="gate" novalidate>
      <img class="gate__logo" src="assets/icons/logo-nav.png" alt="The D. H. Chen Foundation" />
      <h1 class="gate__label">Website preview</h1>
      <label class="gate__label" for="gate-password">Password</label>
      <input class="gate__input" id="gate-password" type="password" autocomplete="current-password" placeholder="Password" required autofocus />
      <button class="gate__btn" type="submit">Enter</button>
      <p class="gate__error" role="alert"></p>
    </form>
  </main>

  <script>
    (function () {
      /* SHA-256 of the preview password; the password itself is not stored */
      var HASH = '6c39072d1be89857ae23e012d6e0cfff9fa4b80db5f5662b5e4b9f051e820bdd';
      var KEY = 'dhc-preview';

      /* go back only to a page of this site (a bare *.html name, with any
         query or hash), never to an address supplied from elsewhere */
      var next = new URLSearchParams(window.location.search).get('next') || '';
      if (!/^[A-Za-z0-9_-]+\.html([?#].*)?$/.test(next)) next = 'index.html';

      try { if (localStorage.getItem(KEY) === HASH) { window.location.replace(next); return; } } catch (e) {}

      var form = document.querySelector('.gate');
      var input = document.getElementById('gate-password');
      var error = document.querySelector('.gate__error');

      function hex(buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) {
          return ('0' + b.toString(16)).slice(-2);
        }).join('');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!window.crypto || !crypto.subtle) {
          error.textContent = 'Please open this page over https.';
          return;
        }
        crypto.subtle.digest('SHA-256', new TextEncoder().encode(input.value)).then(function (buf) {
          if (hex(buf) === HASH) {
            try { localStorage.setItem(KEY, HASH); } catch (err) {}
            window.location.replace(next);
          } else {
            error.textContent = 'Incorrect password. Please try again.';
            input.select();
          }
        });
      });
    })();
  </script>
</body>
</html>
